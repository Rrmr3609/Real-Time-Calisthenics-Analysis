config_schema_version: 1

pose:
  minimum_detection_confidence: 0.5
  minimum_tracking_confidence: 0.5

baseline:
  top_elbow_angle: 150.0
  bottom_elbow_angle: 100.0
  top_extension_warning_threshold: 150.0
  depth_warning_threshold: 100.0
  alignment_warning_minimum: 160.0

features:
  minimum_landmark_visibility: 0.5
  side_acquisition_frames: 3
  side_switch_frames: 5
  side_switch_margin: 0.10
  missing_side_grace_frames: 5
  ema_alpha: 0.3

segmentation:
  top_region_threshold: 130.0
  bottom_region_threshold: 120.0
  hysteresis: 5.0
  phase_confirmation_frames: 3
  missing_angle_grace_frames: 5
  minimum_repetition_frames: 8

classification:
  depth_threshold: 65.0
  extension_threshold: 150.0
  alignment_minimum: 160.0
  alignment_deviation_min_frames: 3
  alignment_deviation_min_ratio: 0.20
  minimum_alignment_valid_ratio: 0.50
